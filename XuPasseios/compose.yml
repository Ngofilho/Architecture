services:
  order:
    build: Order
    ports:
    - "7184:8080"
    depends_on:
    - rabbitmqbackoffice
    networks:
    - backofficenetwork
    container_name: Order
    restart: on-failure
    environment:
      RABBITMQ_HOSTNAME: rabbitmqbckoff

  payment:
    build: Payment
    ports:
    - "7185:8080"
    depends_on:
    - rabbitmqbackoffice
    networks:
    - backofficenetwork
    container_name: Payment
    restart: on-failure
    environment:
      RABBITMQ_HOSTNAME: rabbitmqbckoff

  logistics:
    build:
      context: .
      dockerfile: ./Logistics/Dockerfile
    ports:
    - "7186:8080"
    depends_on:
    - rabbitmqbackoffice
    networks:
    - backofficenetwork
    container_name: Logistics
    restart: on-failure
    environment:
      RABBITMQ_HOSTNAME: rabbitmqbckoff

  marketing:
    build:
      context: .
      dockerfile: ./Marketing/Dockerfile
    ports:
    - "7187:8080"
    depends_on:
    - rabbitmqbackoffice
    networks:
    - backofficenetwork
    container_name: Marketing
    restart: on-failure    
    environment:
      RABBITMQ_HOSTNAME: rabbitmqbckoff

  catalog:
    build: Catalog
    ports:
    # - "8080"
    - "7000:443"
    depends_on:
    - rabbitmqbackoffice
    networks:
    - backofficenetwork
    container_name: Catalog
    restart: on-failure
    environment:
      - RABBITMQ_HOSTNAME=rabbitmqbckoff
      # - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTPS_PORTS=443
      - ASPNETCORE_URLS=https://+;http://+
      - ASPNETCORE_Kestrel__Certificates__Default__Password=-\0pw-
      - ASPNETCORE_Kestrel__Certificates__Default__Path=/https/aspnetapp.pfx
    volumes:
      - ~/.aspnet/https:/https:ro

  checkout:
    build: 
      context: .
      dockerfile: ./Checkout/Dockerfile
    ports:
    # - "8080"
    - "7127:443"
    depends_on:
    - rabbitmqbackoffice
    networks:
    - backofficenetwork
    container_name: Checkout
    restart: on-failure
    environment:
      - RABBITMQ_HOSTNAME=rabbitmqbckoff
      # - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTPS_PORTS=443
      - ASPNETCORE_URLS=https://+;http://+
      - ASPNETCORE_Kestrel__Certificates__Default__Password=-\0pw-
      - ASPNETCORE_Kestrel__Certificates__Default__Path=/https/aspnetapp.pfx
    volumes:
      - ~/.aspnet/https:/https:ro


  cart:
    build: Cart
    ports:
    # - "8080"
    - "7015:443"
    depends_on:
    - rabbitmqbackoffice
    networks:
    - backofficenetwork
    container_name: Cart
    restart: on-failure
    environment:
      - RABBITMQ_HOSTNAME=rabbitmqbckoff
      # - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTPS_PORTS=443
      - ASPNETCORE_URLS=https://+;http://+
      - ASPNETCORE_Kestrel__Certificates__Default__Password=-\0pw-
      - ASPNETCORE_Kestrel__Certificates__Default__Path=/https/aspnetapp.pfx
    volumes:
      - ~/.aspnet/https:/https:ro

  healthcheck:
    build: ServiceBus.HealthCheck
    ports:
    - "7183:8080"
    depends_on:
    - rabbitmqbackoffice
    networks:    
      - backofficenetwork
    container_name: HealthCheck.ServiceBus
    environment:
      RABBITMQ_HOSTNAME: rabbitmqbckoff

  rabbitmqbackoffice:
    build: General/RabbitMQ
    ports:
    - "4369:4369"
    - "5671:5671"
    - "5672:5672"
    - "15671:15671"
    - "15672:15672"
    - "15692:15692"
    - "25672:25672"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://rabbitmqbckoff:15672"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - backofficenetwork
    volumes:
      - rabbitmq_volume:/var/lib/rabbitmq/
    container_name: rabbitmqbackoffice
    hostname: rabbitmqbckoff

  telemetria:
    image: docker.elastic.co/elasticsearch/elasticsearch:7.9.1
    container_name: ElasticSearch_Node01
    environment:
      - node.name=ElasticSearch01  
      - cluster.name=es-docker-cluster
      - bootstrap.memory_lock=true
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
      - discovery.type=single-node
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - esdata01:/usr/share/elasticsearch/data
    ports:
      - 9200:9200
    networks:
      - elastic

  Kibana01:
    image: docker.elastic.co/kibana/kibana:7.9.1
    container_name: Kibana01
    ports:
      - 5601:5601
    environment:
      ELASTICSEARCH_URL: http://ElasticSearch_Node01:9200  
      ELASTICSEARCH_HOSTS: http://ElasticSearch_Node01:9200
    networks:
      - elastic
    

 
    
volumes:
  rabbitmq_volume:
    driver: local
  esdata01:
    driver: local
      

networks:
  backofficenetwork:
    driver: bridge
  elastic:
    driver: bridge